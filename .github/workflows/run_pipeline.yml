- name: Run Pipeline
  run: |
    python part_a.py
    python part_b.py
    python part_c.py
    python part_d.py

- name: Commit Outputs
  run: |
    git config --global user.name "github-actions[bot]"
    git config --global user.email "github-actions[bot]@users.noreply.github.com"
    git add outputs/ data/clean/ state/ data/instamart.db
    git commit -m "Auto-generate all outputs and clean tables" || echo "No changes"
    git push
