name: Run Instamart Copilot Pipeline

on:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate synthetic data
      run: python generate_data.py

    - name: Run Part A (Cleaning & SQLite DB)
      run: python part_a.py

    - name: Run Part B (RFM & Lapse Prediction)
      run: python part_b.py

    - name: Run Part C (Ticket Triage & Guardrails)
      run: python part_c.py

    - name: Run Part D (Policy Assistant & Refund Agent)
      run: python part_d.py

    - name: Commit generated outputs back to repo
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add data/clean/ outputs/ state/ data/instamart.db
        git commit -m "Automated pipeline run outputs [skip ci]" || echo "No changes to commit"
        git push
