name: Run Instamart Copilot Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline
      run: |
        python generate_data.py
        python part_a.py
        python part_b.py
        python part_c.py
        python part_d.py

    - name: Commit Outputs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main --rebase || true
        git add outputs/ data/clean/ state/ data/instamart.db data/raw/ data/policies/
        git commit -m "Auto-generate all pipeline outputs and datasets" || echo "No changes to commit"
        git push
      
        git add outputs/ data/clean/ state/ data/instamart.db data/raw/ data/policies/
        git commit -m "Auto-generate all pipeline outputs and datasets" || echo "No changes to commit"
        git push
